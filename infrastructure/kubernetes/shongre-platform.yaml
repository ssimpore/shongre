apiVersion: apps/v1
kind: Deployment
metadata:
  name: shongre-api
  labels:
    app.kubernetes.io/name: shongre-api
    app.kubernetes.io/part-of: shongre
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shongre-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shongre-api
        app.kubernetes.io/part-of: shongre
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/shongre/backend:REPLACE_WITH_IMMUTABLE_RELEASE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: APP_ENV
              value: production
            - name: BACKEND_HOST
              value: 0.0.0.0
            - name: BACKEND_PORT
              value: "4000"
          envFrom:
            - configMapRef:
                name: shongre-production-config
            - secretRef:
                name: shongre-production-secrets
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shongre-api
  labels:
    app.kubernetes.io/name: shongre-api
    app.kubernetes.io/part-of: shongre
spec:
  selector:
    app.kubernetes.io/name: shongre-api
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shongre-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shongre-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shongre-worker
  labels:
    app.kubernetes.io/name: shongre-worker
    app.kubernetes.io/part-of: shongre
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shongre-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shongre-worker
        app.kubernetes.io/part-of: shongre
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/shongre/backend:REPLACE_WITH_IMMUTABLE_RELEASE_TAG
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/worker.js"]
          env:
            - name: NODE_ENV
              value: production
            - name: APP_ENV
              value: production
            - name: BACKEND_HOST
              value: 0.0.0.0
            - name: BACKEND_PORT
              value: "4000"
          envFrom:
            - configMapRef:
                name: shongre-production-config
            - secretRef:
                name: shongre-production-secrets
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - process.kill(1, 0)
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shongre-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shongre-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shongre-web
  labels:
    app.kubernetes.io/name: shongre-web
    app.kubernetes.io/part-of: shongre
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shongre-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shongre-web
        app.kubernetes.io/part-of: shongre
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/shongre/frontend:REPLACE_WITH_IMMUTABLE_RELEASE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: next-cache
              mountPath: /app/frontend/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shongre-web
  labels:
    app.kubernetes.io/name: shongre-web
    app.kubernetes.io/part-of: shongre
spec:
  selector:
    app.kubernetes.io/name: shongre-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shongre-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shongre-web
