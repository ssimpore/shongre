services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    pull_policy: never
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    pull_policy: never
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"

  worker:
    pull_policy: never
