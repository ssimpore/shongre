name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the npm workspace
        run: npm ci
      - name: Validate synchronized SHONGRE. brand assets
        run: make brand-check
      - name: Enforce semantic design tokens and generated adapters
        run: make tokens-check
      - name: Enforce centralized SEO and GEO discovery governance
        run: make seo-check
      - name: Run the canonical repository gate
        run: make check
      - name: Validate every GitHub Actions workflow
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
      - name: Reject undeclared OpenAPI breaking changes
        if: github.event_name == 'pull_request'
        env:
          OPENAPI_BASE_REF: origin/${{ github.base_ref }}
        run: make openapi-breaking-check
      - name: Reject high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Exercise the production fail-closed configuration gate
        env:
          APP_ENV: production
          NODE_ENV: production
          ENVIRONMENT_ID: shongre-production
          API_ENVIRONMENT_ID: shongre-production
          DATABASE_ENVIRONMENT_ID: shongre-production
          SUPABASE_ENVIRONMENT_ID: shongre-production
          STORAGE_ENVIRONMENT_ID: shongre-production
          PUBLIC_FR_URL: https://fr.shongre.invalid
          PUBLIC_INTL_URL: https://intl.shongre.invalid
          API_URL: https://api.shongre.invalid
          SHONGRE_MARKETPLACE_ORIGIN: https://marketplace.shongre.invalid
          SHONGRE_SOLUTIONS_ORIGIN: https://solutions.shongre.invalid
          SHONGRE_PROSPECTS_ORIGIN: https://prospects.shongre.invalid
          SHONGRE_FACTURATION_ORIGIN: https://facturation.shongre.invalid
          BACKEND_DATA_MODE: database
          DATABASE_INFRA_MODE: hosted
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_ENVIRONMENT_ID: shongre-production
          NEXT_PUBLIC_FR_URL: https://fr.shongre.invalid
          NEXT_PUBLIC_INTL_URL: https://intl.shongre.invalid
          NEXT_PUBLIC_ENABLE_AI_FEATURES: "false"
          NEXT_PUBLIC_API_URL: https://api.shongre.invalid/api/v1
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_ENVIRONMENT_ID: shongre-production
          EXPO_PUBLIC_FR_URL: https://fr.shongre.invalid
          EXPO_PUBLIC_INTL_URL: https://intl.shongre.invalid
          EXPO_PUBLIC_API_URL: https://api.shongre.invalid/api/v1
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_live_${{ github.run_id }}CIOnly
          CORS_ORIGIN: https://fr.shongre.invalid,https://intl.shongre.invalid
          DATABASE_URL: postgresql://ci:ci@db.shongre.invalid:5432/shongre
          REDIS_URL: rediss://ci:ci-only-password@redis.shongre.invalid:6380
          SUPABASE_PROJECT_REF: ci-production-ref
          EXPECTED_SUPABASE_PROJECT_REF: ci-production-ref
          SUPABASE_URL: https://ci-production-ref.supabase.co
          SUPABASE_ANON_KEY: ci-only-anon-key-value
          SUPABASE_SERVICE_ROLE_KEY: ci-only-service-role-key-value-123456789
          JWT_SECRET: ci-only-jwt-signing-key-value-123456789
          MFA_ENCRYPTION_KEY: ci-only-mfa-encryption-key-value-123456789
          PROVIDER_CREDENTIAL_ENCRYPTION_KEY_BASE64: Y2ktb25seS1wcm92aWRlci1jcmVkZW50aWFsLWtleSE=
          PROVIDER_CREDENTIAL_KEY_VERSION: ci-production-v1
          DIGITAL_FULFILLMENT_ENCRYPTION_KEY_BASE64: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
          DIGITAL_FULFILLMENT_KEY_VERSION: ci-production-v1
          AUTH_COOKIE_SECURE: "true"
          SHONGRE_TRUST_PROXY_HOST: "true"
          SHONGRE_TRUST_PROXY_IP: "true"
          AUTH_EMAIL_DELIVERY_URL: https://email.shongre.invalid/send
          AUTH_EMAIL_DELIVERY_TOKEN: ci-only-email-delivery-token-12345
          PAYMENT_MODE: live
          EMAIL_MODE: live
          AI_MODE: production
          ANALYTICS_MODE: production
          PAYMENT_PROVIDER: stripe
          STRIPE_SECRET_KEY: sk_live_${{ github.run_id }}_CIOnlyNotASecret
          STRIPE_WEBHOOK_SECRET: whsec_CI123
          STRIPE_CONNECT_WEBHOOK_SECRET: whsec_CI456
          COMPLIANCE_WEBHOOK_SECRET: ci-only-compliance-webhook-secret-123456
          HANDOVER_PIN_PEPPER: ci-only-handover-pin-pepper-value-123456
          KYC_PROVIDER: stripe
          KYC_PROVIDER_BASE_URL: https://otp.shongre.invalid
          KYC_PROVIDER_API_TOKEN: ci-only-kyc-provider-token
          BUSINESS_REGISTRY_PROVIDER: siret
          BUSINESS_REGISTRY_API_URL: https://api.insee.fr/api-sirene/3.11
          BUSINESS_REGISTRY_API_TOKEN: ci-only-registry-token
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ci-only-gemini-api-key
          GEMINI_MODEL: gemini-2.5-flash
          MALWARE_SCAN_MODE: http
          MALWARE_SCAN_URL: https://scanner.shongre.invalid/v1/scan
          MALWARE_SCAN_TOKEN: ci-only-malware-scanner-token
          ENABLE_SOCIAL_AUTH: "false"
          ENABLE_ACCOUNT_LINKING: "false"
          ENABLE_GOOGLE_AUTH: "false"
          ENABLE_APPLE_AUTH: "false"
          ENABLE_FACEBOOK_AUTH: "false"
        run: make production-config-check

  migrations:
    name: Clean database migration
    runs-on: ubuntu-latest
    # The database-mode browser run builds an isolated production Web
    # checkout on top of the migration, seed and RLS work.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.116.0
      - run: npm ci
      - run: make env
      - name: Apply every migration to a clean local database
        run: |
          make supabase-up
          make db-reset
      - name: Execute database RLS persona tests
        run: supabase test db --workdir backend
      - name: Verify generated database types match the migrated schema
        run: make db-types-check
      - name: Baseline and verify immutable migration checksums
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          make db-migrate
          make db-migrate
          test "$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -qAtc "SELECT count(*) FROM public.profiles WHERE id IN ('00000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000002', '00000000-0000-0000-0000-000000000003', '00000000-0000-0000-0000-000000000004');")" = "0"
      - name: Verify fresh local seeding and editorial preservation
        run: |
          make redis-up
          make db-seed
          make db-seed
          make taxonomy-db-test
      - name: Install the Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Run the browser journeys against the PostgreSQL repositories
        # The demo-mode matrix cannot see a defect that lives only in a
        # Postgres repository; this is the one browser run that can. It is
        # judged against its own record of known failures, like the
        # demo-mode matrix: a new failure fails the job, a recorded one does
        # not hide behind it.
        run: make e2e-triage-database E2E_ARGS=--project=chromium
      - name: Upload database-mode failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-database-mode
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Prove production demo seeding is refused
        env:
          APP_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          ALLOW_DEMO_SEED: "true"
        run: |
          if npm run db:seed --workspace=backend; then
            echo "Production seed unexpectedly succeeded"
            exit 1
          fi
      - name: Stop local database
        if: always()
        run: supabase stop --workdir backend --no-backup

  containers:
    name: Production containers
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make env
      - name: Validate hosted and loopback-only Compose files
        run: make docker-config
      - name: Build backend API/worker artifact
        run: docker build -f backend/Dockerfile -t shongre-backend:local .
      - name: Build environment-agnostic frontend artifact once
        run: docker build -f frontend/Dockerfile -t shongre-frontend:local .
      - name: Audit runtime image contents and migration entrypoint
        run: |
          make docker-audit
          docker run --rm --entrypoint sh shongre-backend:local -c \
            'test -f dist/migrate.js && test -d supabase/migrations && command -v psql >/dev/null'
      - name: Smoke test both runtime entrypoints
        run: |
          source scripts/env.sh
          staging_frontend_port="$((FRONTEND_PORT + 1))"
          runtime_network=shongre-ci-runtime
          docker network create "$runtime_network" >/dev/null
          redis_id=$(docker run -d --network "$runtime_network" --name shongre-ci-redis \
            redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232)
          api_id=$(docker run -d --network "$runtime_network" -p "$BACKEND_PORT:$BACKEND_PORT" \
            -e NODE_ENV=development \
            -e APP_ENV=local \
            -e ENVIRONMENT_ID=shongre-local \
            -e API_ENVIRONMENT_ID=shongre-local \
            -e SUPABASE_ENVIRONMENT_ID=shongre-local \
            -e STORAGE_ENVIRONMENT_ID=shongre-local \
            -e PUBLIC_FR_URL="$PUBLIC_FR_URL" \
            -e PUBLIC_INTL_URL="$PUBLIC_INTL_URL" \
            -e API_URL="$API_URL" \
            -e PAYMENT_MODE=test \
            -e EMAIL_MODE=console \
            -e AI_MODE=mock \
            -e ANALYTICS_MODE=off \
            -e BACKEND_HOST=0.0.0.0 \
            -e BACKEND_PORT="$BACKEND_PORT" \
            -e BACKEND_DATA_MODE=demo \
            -e REDIS_URL=redis://shongre-ci-redis:6379 \
            shongre-backend:local)
          web_dev_id=$(docker run -d -p "$FRONTEND_PORT:$FRONTEND_PORT" \
            -e APP_ENV=development \
            -e ENVIRONMENT_ID=shongre-development \
            -e FRONTEND_PORT="$FRONTEND_PORT" \
            -e PUBLIC_FR_URL=https://dev.shongre.invalid \
            -e PUBLIC_INTL_URL=https://dev-intl.shongre.invalid \
            -e API_URL=https://api-dev.shongre.invalid \
            shongre-frontend:local)
          web_staging_id=$(docker run -d -p "$staging_frontend_port:$FRONTEND_PORT" \
            -e APP_ENV=staging \
            -e ENVIRONMENT_ID=shongre-staging \
            -e FRONTEND_PORT="$FRONTEND_PORT" \
            -e PUBLIC_FR_URL=https://staging.shongre.invalid \
            -e PUBLIC_INTL_URL=https://staging-intl.shongre.invalid \
            -e API_URL=https://api-staging.shongre.invalid \
            shongre-frontend:local)
          worker_id=$(docker run -d --network "$runtime_network" \
            -e NODE_ENV=development \
            -e APP_ENV=local \
            -e ENVIRONMENT_ID=shongre-local \
            -e API_ENVIRONMENT_ID=shongre-local \
            -e SUPABASE_ENVIRONMENT_ID=shongre-local \
            -e STORAGE_ENVIRONMENT_ID=shongre-local \
            -e PUBLIC_FR_URL="$PUBLIC_FR_URL" \
            -e PUBLIC_INTL_URL="$PUBLIC_INTL_URL" \
            -e API_URL="$API_URL" \
            -e PAYMENT_MODE=test \
            -e EMAIL_MODE=console \
            -e AI_MODE=mock \
            -e ANALYTICS_MODE=off \
            -e BACKEND_HOST=0.0.0.0 \
            -e BACKEND_PORT="$BACKEND_PORT" \
            -e BACKEND_DATA_MODE=demo \
            -e REDIS_URL=redis://shongre-ci-redis:6379 \
            shongre-backend:local node dist/worker.js)
          trap 'docker rm -f "$api_id" "$web_dev_id" "$web_staging_id" "$worker_id" "$redis_id" >/dev/null; docker network rm "$runtime_network" >/dev/null' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent "$API_URL/readyz" >/dev/null && \
               curl --fail --silent "$PUBLIC_FR_URL/healthz" >/dev/null && \
               curl --fail --silent "http://127.0.0.1:$staging_frontend_port/healthz" >/dev/null && \
               docker exec "$worker_id" node dist/worker-health.js >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "$API_URL/readyz" >/dev/null
          curl --fail --silent "$PUBLIC_FR_URL/healthz" >/dev/null
          curl --fail --silent "http://127.0.0.1:$staging_frontend_port/healthz" >/dev/null
          docker inspect --format='{{.State.Running}}' "$worker_id" | grep -qx true
          docker exec "$worker_id" node dist/worker-health.js

  web-e2e:
    name: Web E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # The Chromium suite alone takes about half an hour on a laptop with two
    # workers; the single-worker engines are slower still on a hosted runner.
    timeout-minutes: 90
    # Chromium is the blocking browser gate. Firefox and WebKit run single-worker
    # through bounded shards and have no recorded failure baseline yet, so they
    # report without blocking until `make e2e-baseline-update
    # E2E_ARGS=--project=<engine>` has been run on a proven host and the
    # sustained cross-engine matrix is certified (see AGENTS.md, testing).
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make env
      - name: Install browser runtime
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run demo-only journeys against the recorded failure baseline
        run: make e2e-triage E2E_ARGS=--project=${{ matrix.browser }}
      - name: Verify first-party sessions against the isolated test API
        run: make test-web-api-transport E2E_ARGS=--project=${{ matrix.browser }}
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            frontend/playwright-report
            frontend/test-results
            .runtime/e2e-report.json
          if-no-files-found: ignore
          retention-days: 7
