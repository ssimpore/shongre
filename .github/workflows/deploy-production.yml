name: Deploy staging-certified release to PRODUCTION

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full staging-certified commit SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve:
    name: Verify build-once and STAGING certification evidence
    runs-on: ubuntu-latest
    outputs:
      evidence_run_id: ${{ steps.release.outputs.run_id }}
      certification_run_id: ${{ steps.certification.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the certified commit to belong to main
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Download successful immutable build evidence
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          run_id="$(scripts/download-release-evidence.sh release "$RELEASE_SHA" .evidence/release)"
          node scripts/release-manifest.mjs validate .evidence/release/release-manifest.json "$RELEASE_SHA"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Require successful certification of the same digests
        id: certification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          run_id="$(scripts/download-release-evidence.sh certification "$RELEASE_SHA" .evidence/certification)"
          node scripts/release-manifest.mjs verify-certification \
            .evidence/release/release-manifest.json \
            .evidence/certification/staging-certification.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  deploy-production:
    needs: resolve
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: production
      release_sha: ${{ inputs.release_sha }}
      evidence_run_id: ${{ needs.resolve.outputs.evidence_run_id }}
      certification_run_id: ${{ needs.resolve.outputs.certification_run_id }}
      mode: deploy
